[project]
name = "sotaigen-dev"
version = "0.0.0"
description = "Local development commands for a sotaigen checkout"
requires-python = ">=3.14,<3.15"
classifiers = ["Private :: Do Not Upload"]
dependencies = []

[project.scripts]
sotaigen-dev = "sotaigen_dev_cli:main"

[build-system]
requires = ["uv_build==0.13.6"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sotaigen_dev_cli"
module-root = ""
